[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2dxf"
version = "0.4.5"
description = "Interpret vector PDF drawings as structured, editable DXF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyMuPDF>=1.24,<2", "ezdxf>=1.4.4,<2"]

[project.scripts]
pdf2dxf = "pdf2dxf.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2dxf*"]
